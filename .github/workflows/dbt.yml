name: dbt

on:
  pull_request:
    paths: ["dbt_practice/**"]
  push:
    branches: [main]
    paths: ["dbt_practice/**"]
  schedule:
    # 00:30 Europe/Paris. GitHub Actions cron est toujours en UTC et ne suit
    # pas le changement d'heure : 23:30 UTC = 00:30 en hiver (CET, UTC+1),
    # 01:30 en ete (CEST, UTC+2) -- decalage d'1h a ajuster si besoin selon
    # la periode de l'annee.
    - cron: "30 23 * * *"

env:
  DBT_PROFILES_DIR: ${{ github.workspace }}/ci
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
  SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
  SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "dbt-core==1.12.*" "dbt-snowflake==1.12.*" "sqlfluff==3.*" "sqlfluff-templater-dbt==3.*"
      - run: dbt deps --project-dir dbt_practice
      - run: sqlfluff lint dbt_practice/models

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [lint, gitleaks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "dbt-core==1.12.*" "dbt-snowflake==1.12.*"
      - run: dbt build --project-dir dbt_practice
